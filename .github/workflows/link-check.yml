name: Link Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-links:
    name: Validate outbound links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run link validator
        run: bash scripts/check-links.sh
